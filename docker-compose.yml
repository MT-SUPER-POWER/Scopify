services:
  frontend:
    container_name: ${FRONTEND_CONTAINER_NAME:-scopify-web}
    image: node:24
    working_dir: /app
    environment:
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      APP_CFG_BACKEND_HOST: ${BACKEND_PUBLIC_HOST:-127.0.0.1}
      APP_CFG_BACKEND_PORT: ${BACKEND_PUBLIC_PORT:-3838}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    volumes:
      - .:/app
      - scopify-node-modules:/app/node_modules
      - scopify-pnpm-store:/root/.local/share/pnpm/store
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile && pnpm run build:web && pnpm --dir repo/frontend/apps/web run start --hostname 0.0.0.0 --port ${FRONTEND_PORT:-3000}"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - scopify-network

  backend:
    container_name: ${BACKEND_CONTAINER_NAME:-scopify-netease-api}
    image: ${BACKEND_IMAGE_NAME:-scopify-netease-api}:${BACKEND_VERSION:-latest}
    build:
      context: ./repo/backend/api-enhanced
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3838}:${BACKEND_PORT:-3838}"
    environment:
      PORT: ${BACKEND_PORT:-3838}
      HOST: 0.0.0.0
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
    restart: unless-stopped
    networks:
      - scopify-network

volumes:
  scopify-node-modules:
  scopify-pnpm-store:

networks:
  scopify-network:
    driver: bridge
