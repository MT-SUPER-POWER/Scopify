<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scopify Loading</title>
    <style>
      /* 基础重置，适合无边框窗口 */
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: transparent;
        /* 移除深色背景，实现真正的全透明 */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        /* 允许拖拽窗口，Electron 特有属性 */
        -webkit-app-region: drag;
        user-select: none;
      }

      /* 保留原有黑胶旋转，图形直接使用正式品牌资源。 */
      .cd-container {
        position: relative;
        width: 260px;
        height: 260px;
        margin-bottom: 40px;
        animation: spin 3s linear infinite;
        filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.6));
      }

      .cd-artwork {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      /* 加载文字底色 */
      .loading-text {
        position: relative;
        color: #665d50;
        /* 底色变暗，增加视觉层次感 */
        font-size: 18px;
        letter-spacing: 6px;
        text-transform: uppercase;
        font-weight: 600;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        margin-left: 41px;
      }

      /* 使用伪元素叠加一层高亮文字，实现从左到右的填充感 */
      .loading-text::after {
        content: attr(data-text);
        /* 动态读取 html 中的 data-text 属性，工程常用解耦法 */
        position: absolute;
        left: 0;
        top: 0;
        color: #eee8dc;
        overflow: hidden;
        white-space: nowrap;
        width: 0%;
        animation: sweep 2s ease-in-out infinite;
        /* 给顶层文字增加发光感 */
        text-shadow:
          0 0 8px rgba(224, 204, 172, 0.25),
          0 2px 4px rgba(0, 0, 0, 0.8);
      }

      /* 旋转动画关键帧 */
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      /* 文字从左到右填充动画 */
      @keyframes sweep {
        0% {
          width: 0%;
        }

        100% {
          width: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cd-container,
        .loading-text::after {
          animation: none;
        }
        .loading-text::after {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="cd-container">
      <img
        class="cd-artwork"
        src="icons/icon.iconset/icon_512x512.png"
        width="260"
        height="260"
        alt="Scopify 亮绿 S 黑胶标志"
      />
    </div>

    <!-- 增加 data-text 属性供 CSS 伪元素读取 -->
    <div class="loading-text" data-text="Starting ...">Starting ...</div>
  </body>
</html>
