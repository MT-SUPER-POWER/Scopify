[package]
name = "scopify-audio-engine"
version = "0.1.0"
edition = "2021"
description = "Scopify's Windows native audio engine NAPI module"
license = "AGPL-3.0"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12.1", features = ["napi9", "tokio_rt"] }
napi-derive = "3.6.3"
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
rodio = "0.21.1"
url = "2.5.8"

[build-dependencies]
napi-build = "2.4.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
