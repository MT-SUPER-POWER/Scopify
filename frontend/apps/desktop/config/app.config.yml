app:
  gpuAcceleration: true
  devTools: true
  closeAction: 2
frontend:
  devPort: 3000
  host: 127.0.0.1
logging:
  level: info
  format: "[{y}-{m}-{d} {h}:{i}:{s}.{ms}] [{level}] {text}"
  keepDays: 25
network:
  proxyMode: system
  proxyUrl: ""
cache:
  enabled: true
  dir: ""
  maxSizeMB: 256
  pageTtlMinutes: 360
  searchTtlMinutes: 30
updater:
  checkOnStartup: true
  autoDownload: false
