name: Build and Release

on:
  push:
    tags:
      - "v*" # 例如 v1.0.4

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            build_script: release:win
          - os: macos-latest
            build_script: release:mac

    steps:
      # 🟢 拉代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🟢 Node 24
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 🟢 Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7

      # 🟢 安装依赖
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # 🟢 提取 CHANGELOG（解析 docs/CHANGELOG.md 当前版本日志）
      - name: Extract Changelog
        id: changelog_reader
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          # 转义版本号中的点号供 awk 使用
          ESCAPED_VERSION=$(echo "$VERSION" | sed 's/\./\\./g')
          # 从 CHANGELOG.md 提取当前版本的日志（从 ## v1.1.0 到下一个 ## 或文件末尾）
          CHANGELOG=$(awk "/^## ${ESCAPED_VERSION}$/,/^## [^#]/" docs/CHANGELOG.md | sed '$d')
          # 使用 EOF 语法设置多行输出
          echo "log_entries<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # 🟢 核心：根 workspace 脚本构建 renderer、Electron 并发布 assets
      - name: Build & Publish Electron
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run ${{ matrix.build_script }}

      # 🟢 只执行一次：更新 Release Notes
      - name: Update Release Notes
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_BODY: ${{ steps.changelog_reader.outputs.log_entries }}
        run: |
          echo "$CHANGELOG_BODY" > release_notes.md
          gh release edit ${{ github.ref_name }} \
            --notes-file release_notes.md
