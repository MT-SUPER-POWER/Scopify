name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  renderer:
    name: Build immutable Desktop Renderer
    runs-on: ubuntu-latest
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag and workspace versions
        run: bun .github/scripts/verify-release-version.ts ${{ github.ref_name }}

      - name: Build Desktop Renderer once
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bun run build:desktop-renderer

      - name: Verify Renderer manifest and content
        run: bun frontend/apps/desktop/scripts/verify-renderer.ts --source-revision=${{ github.sha }}

      - name: Pack Renderer and write checksum
        shell: bash
        run: |
          tar -czf "renderer-${GITHUB_SHA}.tar.gz" -C frontend/apps/desktop/renderer .
          sha256sum "renderer-${GITHUB_SHA}.tar.gz" > "renderer-${GITHUB_SHA}.tar.gz.sha256"

      - name: Upload immutable Renderer artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: renderer-${{ github.sha }}
          path: |
            renderer-${{ github.sha }}.tar.gz
            renderer-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package Desktop (${{ matrix.platform }})
    needs: renderer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            package-script: package:win
          - platform: macos
            os: macos-latest
            package-script: package:mac

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download locked Renderer artifact
        uses: actions/download-artifact@v5
        with:
          name: renderer-${{ github.sha }}
          path: .artifacts/renderer

      - name: Verify archive checksum and unpack Renderer
        run: >-
          bun .github/scripts/unpack-renderer-artifact.ts
          .artifacts/renderer/renderer-${{ github.sha }}.tar.gz
          .artifacts/renderer/renderer-${{ github.sha }}.tar.gz.sha256
          frontend/apps/desktop/renderer

      - name: Verify Renderer manifest and content again
        run: bun frontend/apps/desktop/scripts/verify-renderer.ts --source-revision=${{ github.sha }}

      - name: Build Electron host
        run: bunx turbo run build --filter=@scopify/desktop

      - name: Package Electron without publishing
        run: bun run --cwd frontend/apps/desktop ${{ matrix.package-script }}

      - name: Upload platform release files
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ github.sha }}
          path: |
            frontend/apps/desktop/dist/*.exe
            frontend/apps/desktop/dist/*.dmg
            frontend/apps/desktop/dist/*.zip
            frontend/apps/desktop/dist/*.blockmap
            frontend/apps/desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [renderer, package]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download platform release files
        uses: actions/download-artifact@v5
        with:
          pattern: desktop-*-${{ github.sha }}
          path: release
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        working-directory: release
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Attest release binaries
        uses: actions/attest@v4
        with:
          subject-path: release/*

      - name: Extract changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          awk -v heading="## ${VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' docs/CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            printf 'Scopify %s\n' "$VERSION" > release_notes.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi

          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            "${release_flags[@]}"
