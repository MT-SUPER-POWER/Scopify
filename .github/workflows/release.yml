name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  renderer:
    name: Build immutable Desktop Renderer
    runs-on: ubuntu-latest
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag and workspace versions
        run: bun .github/scripts/verify-release-version.ts ${{ github.ref_name }}

      - name: Build and sync Desktop Renderer once
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bun run sync:renderer

      - name: Verify Renderer manifest and content
        run: bun repo/frontend/apps/desktop/scripts/verify-renderer.ts --source-revision=${{ github.sha }}

      - name: Pack Renderer and write checksum
        shell: bash
        run: |
          tar -czf "renderer-${GITHUB_SHA}.tar.gz" -C repo/frontend/apps/desktop/build/desktop/app/renderer .
          sha256sum "renderer-${GITHUB_SHA}.tar.gz" > "renderer-${GITHUB_SHA}.tar.gz.sha256"

      - name: Upload immutable Renderer artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: renderer-${{ github.sha }}
          path: |
            renderer-${{ github.sha }}.tar.gz
            renderer-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package Desktop (${{ matrix.platform }})
    needs: renderer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            package-script: package:win
            artifact-path: |
              repo/frontend/apps/desktop/build/release/*.exe
              repo/frontend/apps/desktop/build/release/*.blockmap
              repo/frontend/apps/desktop/build/release/latest*.yml
            required-artifacts: |
              repo/frontend/apps/desktop/build/release/*.exe
              repo/frontend/apps/desktop/build/release/*.blockmap
              repo/frontend/apps/desktop/build/release/latest.yml
          - platform: macos
            os: macos-latest
            package-script: package:mac
            artifact-path: |
              repo/frontend/apps/desktop/build/release/*.dmg
              repo/frontend/apps/desktop/build/release/*.zip
              repo/frontend/apps/desktop/build/release/*.blockmap
              repo/frontend/apps/desktop/build/release/latest*.yml
            required-artifacts: |
              repo/frontend/apps/desktop/build/release/*.dmg
              repo/frontend/apps/desktop/build/release/*.zip
              repo/frontend/apps/desktop/build/release/*.blockmap
              repo/frontend/apps/desktop/build/release/latest-mac.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Enable Developer Mode (symlinks on Windows)
        if: matrix.platform == 'windows'
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Electron distribution
        shell: bash
        run: |
          set -euo pipefail
          electron_dir="repo/frontend/apps/desktop/node_modules/electron"
          if [[ ! -f "${electron_dir}/dist/version" ]]; then
            node "${electron_dir}/install.js"
          fi
          test -f "${electron_dir}/dist/version"

      - name: Download locked Renderer artifact
        uses: actions/download-artifact@v5
        with:
          name: renderer-${{ github.sha }}
          path: .artifacts/renderer

      - name: Verify archive checksum and unpack Renderer
        run: >-
          bun .github/scripts/unpack-renderer-artifact.ts
          .artifacts/renderer/renderer-${{ github.sha }}.tar.gz
          .artifacts/renderer/renderer-${{ github.sha }}.tar.gz.sha256
          repo/frontend/apps/desktop/build/desktop/app/renderer

      - name: Verify Renderer manifest and content again
        run: bun repo/frontend/apps/desktop/scripts/verify-renderer.ts --source-revision=${{ github.sha }}

      - name: Build Electron host
        run: bunx turbo run build --filter=@scopify/desktop

      - name: Package Electron without publishing
        run: bunx turbo run ${{ matrix.package-script }} --filter=@scopify/desktop

      - name: Verify platform release outputs
        shell: bash
        env:
          REQUIRED_ARTIFACTS: ${{ matrix.required-artifacts }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          while IFS= read -r pattern; do
            [[ -z "${pattern}" ]] && continue
            matches=( ${pattern} )
            if (( ${#matches[@]} == 0 )); then
              echo "Missing required release artifact: ${pattern}" >&2
              exit 1
            fi
          done <<< "${REQUIRED_ARTIFACTS}"

      - name: Upload platform release files
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [renderer, package]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download platform release files
        uses: actions/download-artifact@v5
        with:
          pattern: desktop-*-${{ github.sha }}
          path: release
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        working-directory: release
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Attest release binaries
        uses: actions/attest@v4
        with:
          subject-path: release/*

      - name: Extract changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          awk -v heading="## ${VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' docs/CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Error: Release notes heading '## ${VERSION}' not found in docs/CHANGELOG.md" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi

          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            "${release_flags[@]}"
