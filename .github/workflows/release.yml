name: Build and Release

on:
  workflow_call:
    inputs:
      tag:
        description: Validated immutable release tag
        required: true
        type: string
      revision:
        description: Commit pinned by the publishing workflow
        required: true
        type: string
      prerelease:
        description: Publish without updating the stable release channel
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  renderer:
    name: Build immutable Desktop Renderer
    runs-on: ubuntu-latest
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ inputs.revision }}
          fetch-depth: 0

      - name: Checkout backend API submodules only
        run: git submodule update --init --depth 1 repo/backend/api-enhanced repo/backend/qq-music-api

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun (script and test runtime)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply tag version and generate CHANGELOG
        run: bun .github/scripts/apply-release.ts "${RELEASE_TAG}" --changelog

      - name: Generate release notes from commits
        run: |
          pnpm exec git-cliff --latest --strip all --output release_notes.md
          bun .github/scripts/format-release-notes.ts "${RELEASE_TAG}" release_notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ inputs.revision }}
          path: release_notes.md
          if-no-files-found: error

      - name: Build and sync Desktop Renderer once
        env:
          GITHUB_SHA: ${{ inputs.revision }}
          SCOPIFY_RELEASE_NOTES_STRICT: "1"
        run: pnpm run sync:renderer

      - name: Verify Renderer manifest and content
        run: bun repo/frontend/apps/desktop/scripts/build/verify-renderer.ts --source-revision=${{ inputs.revision }}

      - name: Pack Renderer and write checksum
        shell: bash
        env:
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          tar -czf "renderer-${RELEASE_REVISION}.tar.gz" -C repo/frontend/apps/desktop/build/desktop/app/renderer .
          sha256sum "renderer-${RELEASE_REVISION}.tar.gz" > "renderer-${RELEASE_REVISION}.tar.gz.sha256"

      - name: Upload immutable Renderer artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: renderer-${{ inputs.revision }}
          compression-level: 0
          path: |
            renderer-${{ inputs.revision }}.tar.gz
            renderer-${{ inputs.revision }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package Desktop (${{ matrix.platform }})
    needs: renderer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            package-script: package:win:prebuilt
            artifact-path: |
              repo/frontend/apps/desktop/build/release/*.exe
              repo/frontend/apps/desktop/build/release/*.blockmap
              repo/frontend/apps/desktop/build/release/latest*.yml
            required-artifacts: |
              repo/frontend/apps/desktop/build/release/*x64*.exe
              repo/frontend/apps/desktop/build/release/*arm64*.exe
              repo/frontend/apps/desktop/build/release/*.blockmap
              repo/frontend/apps/desktop/build/release/latest.yml
          - platform: macos
            os: macos-latest
            package-script: package:mac:prebuilt
            artifact-path: |
              repo/frontend/apps/desktop/build/release/*.dmg
              repo/frontend/apps/desktop/build/release/*.zip
              repo/frontend/apps/desktop/build/release/*.blockmap
              repo/frontend/apps/desktop/build/release/latest*.yml
            required-artifacts: |
              repo/frontend/apps/desktop/build/release/*.dmg
              repo/frontend/apps/desktop/build/release/*.zip
              repo/frontend/apps/desktop/build/release/*.blockmap
              repo/frontend/apps/desktop/build/release/latest-mac.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ inputs.revision }}

      - name: Checkout backend API submodules only
        run: git submodule update --init --depth 1 repo/backend/api-enhanced repo/backend/qq-music-api

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun (script and test runtime)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Enable Developer Mode (symlinks on Windows)
        if: matrix.platform == 'windows'
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install local backend dependencies
        working-directory: repo/backend/api-enhanced
        run: pnpm install --frozen-lockfile

      - name: Apply tag version
        shell: bash
        run: bun .github/scripts/apply-release.ts "${RELEASE_TAG}"

      - name: Download locked Renderer artifact
        uses: actions/download-artifact@v5
        with:
          name: renderer-${{ inputs.revision }}
          path: .artifacts/renderer

      - name: Verify archive checksum and unpack Renderer
        run: >-
          bun .github/scripts/unpack-renderer-artifact.ts
          .artifacts/renderer/renderer-${{ inputs.revision }}.tar.gz
          .artifacts/renderer/renderer-${{ inputs.revision }}.tar.gz.sha256
          repo/frontend/apps/desktop/build/desktop/app/renderer

      - name: Verify Renderer manifest and content again
        run: bun repo/frontend/apps/desktop/scripts/build/verify-renderer.ts --source-revision=${{ inputs.revision }}

      - name: Setup native build cache
        uses: ./.github/actions/setup-native-build

      - name: Build host and native modules, validate and package locked Renderer
        run: pnpm exec turbo run ${{ matrix.package-script }} --filter=@scopify/desktop

      - name: Verify platform release outputs
        shell: bash
        env:
          REQUIRED_ARTIFACTS: ${{ matrix.required-artifacts }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          while IFS= read -r pattern; do
            [[ -z "${pattern}" ]] && continue
            matches=( ${pattern} )
            if (( ${#matches[@]} == 0 )); then
              echo "Missing required release artifact: ${pattern}" >&2
              exit 1
            fi
          done <<< "${REQUIRED_ARTIFACTS}"

      - name: Upload platform release files
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ inputs.revision }}
          compression-level: 0
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [renderer, package]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}

      - name: Download platform release files
        uses: actions/download-artifact@v5
        with:
          pattern: desktop-*-${{ inputs.revision }}
          path: release
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        working-directory: release
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Attest release binaries
        uses: actions/attest@v4
        with:
          subject-path: release/*

      - name: Download user-facing release notes
        uses: actions/download-artifact@v5
        with:
          name: release-notes-${{ inputs.revision }}
          path: .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          # Both annotated and lightweight tags are verified against the locked commit.
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          if [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" != "${RELEASE_REVISION}" ]]; then
            echo "::error::Release tag changed during the build."
            exit 1
          fi
          release_flags=()
          if [[ "${RELEASE_PRERELEASE}" == true ]]; then
            release_flags+=(--prerelease --latest=false)
          fi

          gh release create "${RELEASE_TAG}" release/* \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --notes-file release_notes.md \
            "${release_flags[@]}"

  writeback:
    name: Write CHANGELOG and versions back to master
    if: ${{ !inputs.prerelease }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HUSKY: "0"
      RELEASE_REVISION: ${{ inputs.revision }}

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          submodules: false

      - name: Checkout backend API submodules only
        run: git submodule update --init --depth 1 repo/backend/api-enhanced repo/backend/qq-music-api

      - name: Skip tags that are not on master
        id: on-master
        shell: bash
        run: |
          if git merge-base --is-ancestor "${RELEASE_REVISION}" HEAD; then
            echo "apply=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::${RELEASE_TAG} is not on master; skipping write-back."
          fi

      - name: Setup Node.js
        if: steps.on-master.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        if: steps.on-master.outputs.apply == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Bun (script and test runtime)
        if: steps.on-master.outputs.apply == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        if: steps.on-master.outputs.apply == 'true'
        run: pnpm install --frozen-lockfile

      - name: Commit CHANGELOG and versions
        if: steps.on-master.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun .github/scripts/apply-release.ts "${RELEASE_TAG}" --changelog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CHANGELOG.md package.json repo/frontend/apps/*/package.json
          if git diff --cached --quiet; then
            echo "Nothing to write back."
            exit 0
          fi
          git commit -m "chore(release): ${RELEASE_TAG} [skip ci]"
          git push origin HEAD:master
