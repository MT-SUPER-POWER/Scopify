name: Hajimi Bot

# 在 issue / PR 评论里写 /oc 或 /opencode 触发 opencode agent，以自建 GitHub App 的身份回复。
# 仅仓库所有者、成员与协作者可触发。需要的 Secrets：
#   OPENCODE_API_KEY          opencode Zen 密钥
#   HAJIMI_APP_CLIENT_ID      GitHub App 的 Client ID
#   HAJIMI_APP_PRIVATE_KEY    GitHub App 的私钥（.pem 全文）
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: hajimi-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bot:
    name: Hajimi (/oc)
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Generate bot token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HAJIMI_APP_CLIENT_ID }}
          private-key: ${{ secrets.HAJIMI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # opencode 会 git fetch PR 分支并推送提交，需要保留凭证
          persist-credentials: true
          token: ${{ steps.token.outputs.token }}

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          bot_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      # 评论内容经环境变量传入，避免被当作脚本注入
      - name: Build prompt
        id: prompt
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          {
            echo 'text<<HAJIMI_PROMPT_EOF'
            cat .github/opencode/persona.md
            printf '\n\n## 用户指令（来自触发评论，请严格按此执行）\n%s\n' "$COMMENT_BODY"
            echo 'HAJIMI_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      # 固定到 v1.19.5 的提交，避免可变引用拿到 App 令牌与密钥
      - name: Run opencode
        uses: anomalyco/opencode/github@810c0eba1a7348036f8bdf61e6632d0c36c6876c
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          OPENCODE_PERMISSION: '{"permission":{"*":"allow","question":"deny"}}'
        with:
          model: opencode/glm-5.3-flash-free
          use_github_token: true
          prompt: ${{ steps.prompt.outputs.text }}
