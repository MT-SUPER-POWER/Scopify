name: CI Quality Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Lint commit messages
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Lint commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  typecheck:
    name: Typecheck
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Run Typecheck
        run: pnpm run typecheck

  format:
    name: Format
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Run Format Check
        run: pnpm run format:check

  lint:
    name: Lint
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # `pnpm run lint` 已包含架构检查与共享包质量覆盖检查。
      - name: Run Lint
        run: pnpm run lint

  test:
    name: Test
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Run Workspace Governance Tests
        run: pnpm run test

      - name: Run Shared Package Tests
        run: pnpm run test:packages

  quality-gate:
    name: Typecheck, Format, Lint and Test
    if: always() && github.event.pull_request.draft == false
    needs: [commitlint, typecheck, format, lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: Require all quality checks to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          if echo "${RESULTS}" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::One or more quality checks did not pass."
            exit 1
          fi
