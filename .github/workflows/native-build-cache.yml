name: Warm Desktop native build cache

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "repo/frontend/apps/desktop/native/**"
      - "repo/frontend/apps/desktop/scripts/build-*.ts"
      - "repo/frontend/apps/desktop/lib/napiBuild.ts"
      - "repo/frontend/apps/desktop/package.json"
      - "pnpm-lock.yaml"
      - ".github/actions/setup-native-build/**"
      - ".github/actions/setup-workspace/**"
      - ".github/workflows/native-build-cache.yml"

permissions:
  contents: read

concurrency:
  group: desktop-native-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Warm native dependencies (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Setup native build cache
        uses: ./.github/actions/setup-native-build

      - name: Build wallpaper bridge for both architectures
        run: pnpm --filter @scopify/desktop run wallpaper:build --all-arch

      - name: Build Windows audio engine for both architectures
        if: runner.os == 'Windows'
        run: pnpm --filter @scopify/desktop run audio:build --all-arch

      - name: Build Windows taskbar lyrics for both architectures
        if: runner.os == 'Windows'
        run: pnpm --filter @scopify/desktop run taskbar:build --all-arch
