name: Warm Desktop native build cache

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "repo/frontend/apps/desktop/native/**"
      - "repo/frontend/apps/desktop/scripts/native/**"
      - "repo/frontend/apps/desktop/lib/napiBuild.ts"
      - "repo/frontend/apps/desktop/package.json"
      - "repo/frontend/apps/desktop/turbo.json"
      - "turbo.json"
      - "pnpm-lock.yaml"
      - ".github/actions/setup-native-build/**"
      - ".github/actions/setup-workspace/**"
      - ".github/workflows/native-build-cache.yml"

permissions:
  contents: read

concurrency:
  group: desktop-native-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Warm native dependencies (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            native-tasks: wallpaper:build:all audio:build:all taskbar:build:all
          - os: macos-latest
            native-tasks: wallpaper:build:all
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Setup native build cache
        uses: ./.github/actions/setup-native-build

      - name: Build native modules for both architectures
        run: pnpm exec turbo run ${{ matrix.native-tasks }} --filter=@scopify/desktop
