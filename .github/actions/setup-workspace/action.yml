name: Setup workspace
description: Checkout-independent toolchain setup and dependency install shared by CI jobs

runs:
  using: composite
  steps:
    - name: Checkout backend API submodule only
      shell: bash
      run: git submodule update --init --depth 1 repo/backend/api-enhanced

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Bun (script and test runtime)
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.11

    - name: Resolve pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Cache Turbo build outputs
      uses: actions/cache@v4
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.job }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
